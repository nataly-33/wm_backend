# ===========================
# APPLICATION
# ===========================
spring.application.name=workflow-back
server.port=8080
server.servlet.context-path=/
spring.config.import=optional:file:.env[.properties]

# ===========================
# MONGODB
# ===========================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/workflow_db}
spring.data.mongodb.database=workflow_db
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.map-key-dot-replacement=__dot__

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET:workflow-secret-key-muy-largo-para-produccion-2024-minimo-32-caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================
# LOGGING
# ===========================
logging.level.root=INFO
logging.level.com.workflow=DEBUG

# ===========================
# SWAGGER / OPENAPI
# ===========================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===========================
# IA MICROSERVICE
# ===========================
ia.service.url=${IA_SERVICE_URL:http://localhost:8001}

# ===========================
# FIREBASE
# ===========================
# Ruta explicita por defecto para desarrollo local.
# Opcionalmente puede sobreescribirse con FIREBASE_CREDENTIALS (path/json/base64)
firebase.credentials=${FIREBASE_CREDENTIALS:./secrets/firebase-service-account.json}

# ===========================
# AWS S3 (opcional - se activa con aws.s3.enabled=true)
# Las variables AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION y AWS_S3_BUCKET
# se leen directamente desde .env (o variables de entorno del sistema).
# ===========================
aws.s3.enabled=true

# ===========================
# DYNAMODB (opcional - se activa con aws.dynamodb.enabled=true)
# ===========================
aws.dynamodb.enabled=false

# ===========================
# MULTIPART / UPLOAD ARCHIVOS
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
archivos.upload-dir=./uploads

# ===========================
# LOGGING
# ===========================
logging.level.com.workflow=DEBUG
logging.level.org.springframework.security=INFO

# ===========================
# ONLYOFFICE
# ===========================
onlyoffice.server.url=${ONLYOFFICE_URL:http://localhost:8088}
onlyoffice.callback.url=${BACKEND_URL:http://host.docker.internal:8080}/api/v1/onlyoffice/callback/
onlyoffice.jwt.secret=workflow-onlyoffice-secret-key-para-evitar-el-error-de-256-bits